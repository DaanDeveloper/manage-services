[package]
name = "service-desk"
version = "0.1.0"
description = "Desktop app for managing local services"
authors = ["Service Desk"]
edition = "2021"

[lib]
name = "service_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["macos-private-api", "tray-icon", "image-png"] }
